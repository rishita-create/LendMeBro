<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LendMeBro – Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--cobalt:#344FC4;--butter:#F0D88A;--lilac:#BDB1D8;--pist:#A9B99B;--cream:#F5F0E6;--ink:#292638}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.f{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;line-height:1.15;margin:0 0 8px}
.demo{background:var(--ink);color:#fff;text-align:center;font-size:13px;padding:6px 10px}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap;max-width:1080px;margin:0 auto}
.logo{font:700 26px "Space Grotesk",system-ui,sans-serif;color:var(--cobalt);cursor:pointer}
nav{display:flex;gap:16px;flex:1;flex-wrap:wrap}nav a{cursor:pointer;font-weight:500}nav a:hover{color:var(--cobalt)}
.btn{border:2px solid var(--ink);background:var(--cobalt);color:#fff;border-radius:99px;padding:10px 20px;font-weight:700;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .15s}
.btn:hover{transform:translate(-1px,-2px)}.btn.s{background:var(--cream);color:var(--ink)}.btn.sm{padding:5px 14px;font-size:14px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--cream);border:2px solid var(--ink);border-radius:16px;padding:16px;box-shadow:4px 4px 0 var(--ink)}
.st{display:inline-block;border:2px solid var(--ink);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;transform:rotate(-2deg);background:var(--butter)}
.st.g{background:var(--pist)}.st.l{background:var(--lilac)}
main{max-width:1080px;margin:0 auto;padding:12px 20px 60px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.band{background:var(--lilac);margin:32px -20px;padding:28px 20px}
.cover{height:120px;border:2px solid var(--ink);border-radius:12px;display:flex;align-items:flex-end;padding:8px;margin-bottom:10px}
input,select,textarea{width:100%;border:2px solid var(--ink);border-radius:12px;padding:10px;background:#fff;margin:4px 0 12px;font:inherit}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.steps span{padding:3px 10px;border:2px solid var(--ink);border-radius:99px;font-size:13px}.steps .on{background:var(--butter);font-weight:700}.steps .done{background:var(--pist)}
.modal{position:fixed;inset:0;background:#292638cc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:460px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:10;max-width:90%}
table{width:100%;border-collapse:collapse}td,th{border-bottom:2px solid var(--ink);padding:8px;text-align:left}
.code{font:700 32px "Space Grotesk",monospace;letter-spacing:8px;background:var(--butter);border:2px dashed var(--ink);border-radius:12px;padding:10px;text-align:center}
.bar{height:16px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}.bar i{display:block;height:100%;background:var(--cobalt)}
.note{background:var(--butter);transform:rotate(-1deg)}.pv{max-width:100%;max-height:200px;border:2px solid var(--ink);border-radius:12px;margin-top:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="demo">Prototype for pitching. All books, people and numbers are demo data. No real payments, verification or tracking happen.</div>
<header><span class="logo" onclick="go('home')">LendMeBro</span>
<nav><a onclick="go('explore')">Explore</a><a onclick="go('wanted')">Wanted</a><a onclick="go('how')">How it works</a><a onclick="go('dash')">Dashboard</a><a onclick="go('notifs')">🔔 Notifications</a></nav>
<button class="btn s sm" onclick="go('signup')">Sign up</button><button class="btn sm" onclick="lb(1)">Lend a book</button></header>
<main id="app"></main><div id="m"></div>
<script>
const $=s=>document.querySelector(s);
const B=[["Engineering Physics","Physics","Good",40,"North Kolkata","#BDB1D8","Aarav"],["Organic Chemistry Basics","Chemistry","Like new",50,"South Kolkata","#F0D88A","Meera"],["Data Structures in C","Computer Science","Good",60,"Salt Lake","#A9B99B","Rohan"],["Microeconomics Primer","Economics","Fair",30,"North Kolkata","#BDB1D8","Isha"],["Biochemistry Companion","Biotechnology","Good",40,"Howrah","#F0D88A","Kabir"],["Indian Polity Prep Guide","Competitive exams","Good",50,"South Kolkata","#A9B99B","Tara"],["Classic Novel Collection","Fiction","Like new",20,"Salt Lake","#BDB1D8","Dev"],["Calculus Workbook","Maths","Fair",30,"North Kolkata","#F0D88A","Naina"]];
const S={s:"home",b:0,v:"none",st:1,acc:-1,f:"All",sub:"All",lst:1,ph:0,W:[{h:"QuietBookworm_17",t:"Anyone have a Biochemistry book for sem 2?",n:3},{h:"PaperPlane_42",t:"Looking for a data structures book, can pick up near Salt Lake",n:5},{h:"SleepyOwl_08",t:"Does anyone have last year’s organic chemistry workbook?",n:2}]};
const fee=f=>{const p=Math.max(10,Math.round(f*.2));return{p,t:f+p}};
function t(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2600)}
function go(s,b){S.s=s;if(b!==undefined)S.b=b;mod();render()}
function render(){$("#app").innerHTML=V[S.s]();window.scrollTo(0,0)}
function mod(h){$("#m").innerHTML=h?`<div class="modal" onclick="if(event.target===this)mod()"><div class="card">${h}</div></div>`:""}
const steps=(a,n)=>`<div class="steps">${a.map((x,i)=>`<span class="${i+1<n?"done":i+1==n?"on":""}">${x}</span>`).join("")}</div>`;
const card=i=>{const b=B[i];return`<div class="card" style="cursor:pointer" onclick="go('book',${i})"><div class="cover" style="background:${b[5]}"><span class="st g">${b[2]}</span></div><h3>${b[0]}</h3><div>${b[1]} · ${b[4]}</div><b style="color:var(--cobalt)">₹${b[3]} / 30 days</b></div>`};
const wcard=(p,i)=>`<div class="card note"><p>“${p.t}”</p><small>${p.h} · ${p.n} said “me too”</small><div class="row"><button class="btn sm" onclick="t('Offer sent to the poster (demo)')">I have this</button><button class="btn sm s" onclick="S.W[${i}].n++;render()">Me too</button></div></div>`;
function hid(){return`<div class="card" style="margin-bottom:16px"><b>Demo screens:</b> <small>jump anywhere</small><div class="row">${[["home","Home"],["explore","Explore"],["book","Book page"],["lend","Lender requests"],["loan","Loan flow"],["wanted","Wanted board"],["list","List a book"],["verify","Verification"],["rewards","Rewards"]].map(x=>`<button class="btn sm s" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}</div></div>`}
function req(n){const b=B[S.b],f=fee(b[3]);
if(n==1)mod(`<h2>Borrow “${b[0]}”</h2>${steps(["Duration","Meetup","Message"],1)}<label>How long?</label><select><option>14 days</option><option selected>30 days</option></select><button class="btn" onclick="req(2)">Next</button>`);
if(n==2)mod(`<h2>Where to meet</h2>${steps(["Duration","Meetup","Message"],2)}<label>Suggested public spot</label><select><option>College library entrance</option><option>Main gate</option><option>Metro station concourse</option></select><label>Time window</label><select><option>Weekday evening</option><option>Weekend morning</option></select><button class="btn" onclick="req(3)">Next</button>`);
if(n==3)mod(`<h2>Review and send</h2>${steps(["Duration","Meetup","Message"],3)}<label>Message to ${b[6]} (optional)</label><textarea rows="2" placeholder="Phone numbers and links are blocked"></textarea><table><tr><td>Borrowing fee</td><td>₹${b[3]}</td></tr><tr><td>Platform fee</td><td>₹${f.p}</td></tr><tr><th>Total</th><th>₹${f.t}</th></tr></table><p><small>Charged only if the lender accepts. Demo: no real money moves.</small></p><button class="btn" onclick="mod();t('Request sent. ${b[6]} will choose a borrower.');go('dash')">Send request</button>`)}
function lb(n){S.s="list";S.lst=n;mod();render()}
function pv(i){const f=i.files[0];if(f)$("#pvi").innerHTML=`<img class="pv" src="${URL.createObjectURL(f)}" alt="Preview of the selected file">`}
const V={
home(){return`<section style="padding:28px 0"><span class="st">Starting in Kolkata</span><h1 style="font-size:clamp(34px,6vw,60px);max-width:780px;margin:14px 0">Need a book? Don’t buy it. Borrow it, bro.</h1><p style="max-width:560px;font-size:18px">Find textbooks, ask for what you can’t find, and share what you’ve got. A student-powered community.</p><input style="max-width:560px;height:48px" placeholder="Search for a book, subject, author or course…" onkeydown="if(event.key==='Enter')go('explore')"><div class="row"><button class="btn" onclick="go('explore')">Explore books</button><button class="btn s" onclick="lb(1)">Lend something</button></div></section>
<h2>Wanted right now</h2><div class="grid" style="margin:14px 0 28px">${S.W.map(wcard).join("")}</div><h2>Books near you</h2><div class="grid" style="margin-top:14px">${[0,1,2,3].map(card).join("")}</div>
<div class="band"><h2>How it works</h2><div class="grid"><div class="card"><h3>Find it</h3>Search by book, course or college.</div><div class="card"><h3>Ask the owner</h3>They choose who gets it.</div><div class="card"><h3>Meet and scan</h3>A handover code starts the loan.</div><div class="card"><h3>Return it, bro</h3>Both confirm, both rate.</div></div></div>
<h2>Why it’s safe</h2><div class="row"><span class="st g">Verified students</span><span class="st l">Handover codes</span><span class="st">Condition photos</span><span class="st g">Public meetup points</span></div>
<div class="card" style="margin-top:28px;background:var(--butter)"><h2>Ready to borrow or lend?</h2><p>Sign up with your college email.</p><button class="btn" onclick="go('signup')">Sign up</button></div>`},
explore(){const A=["All","North Kolkata","South Kolkata","Salt Lake","Howrah"],subs=["All",...new Set(B.map(b=>b[1]))];const L=B.map((b,i)=>i).filter(i=>(S.f=="All"||B[i][4]==S.f)&&(S.sub=="All"||B[i][1]==S.sub));
return`<h1>Explore books</h1><div class="row">${A.map(a=>`<button class="btn sm ${a==S.f?"":"s"}" onclick="S.f='${a}';render()">${a}</button>`).join("")}</div><select style="max-width:260px" onchange="S.sub=this.value;render()">${subs.map(s=>`<option ${s==S.sub?"selected":""}>${s}</option>`).join("")}</select>
${L.length?`<div class="grid">${L.map(card).join("")}</div>`:`<div class="card"><h3>Nobody’s listed this yet.</h3><p>Ask for it on the Wanted board.</p><button class="btn" onclick="go('wanted')">Go to Wanted</button></div>`}`},
book(){const b=B[S.b],f=fee(b[3]);return`<button class="btn sm s" onclick="go('explore')">Back</button><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:16px"><div><div class="cover" style="height:260px;background:${b[5]}"><span class="st g">${b[2]}</span></div></div><div><h1>${b[0]}</h1><p>${b[1]} · ${b[4]} · Demo listing</p><div class="card"><b>${b[6]} (demo)</b> <span class="st g">Student verified</span><br><small>New lender · 0 loans yet</small></div><div class="card" style="margin-top:16px"><table><tr><td>Borrowing fee (30 days)</td><td>₹${b[3]}</td></tr><tr><td>Platform fee</td><td>₹${f.p}</td></tr><tr><th>Total</th><th>₹${f.t}</th></tr></table><small>Meetup points: library entrance, main gate, metro concourse</small></div><div class="row"><button class="btn" onclick="req(1)">Lend Me Bro</button><button class="btn s" onclick="t('Saved (demo)')">Save</button><button class="btn s" onclick="t('Report form would open (demo)')">Report</button></div></div></div>`},
lend(){const R=[["Rohan","4.8 · 6 loans","30 days"],["Isha","New borrower","14 days"],["Dev","5.0 · 2 loans","30 days"]];return`<h1>Requests for your books</h1><p>Engineering Physics has ${R.length} requests. You choose who gets it.</p>${R.map((r,i)=>`<div class="card" style="margin:14px 0"><b>${r[0]} (demo)</b> <span class="st g">Student verified</span><br>${r[1]} · wants ${r[2]}<div class="row">${S.acc<0?`<button class="btn sm" onclick="S.acc=${i};t('BROOO. It’s yours! Pick a time to meet.');render()">Accept</button><button class="btn sm s" onclick="t('Declined kindly (demo)')">Decline</button>`:S.acc==i?`<span class="st g">Accepted</span><button class="btn sm" onclick="go('loan')">Go to handover</button>`:`<span class="st l">Not selected</span><small>This book found its next study buddy. Keep hunting, bro!</small>`}</div></div>`).join("")}`},
loan(){const n=S.st,A=["Accepted","Handover","Reading","Return","Done"];let c="";
if(n==1)c=`<p>Meet at the library entrance on a weekday evening.</p><button class="btn" onclick="S.st=2;render()">Go to handover</button>`;
if(n==2)c=`<p>Both of you add condition photos. Then the borrower shows the code.</p><div class="row"><button class="btn sm s" onclick="S.ph++;render()">Add photo</button><span class="st g">${S.ph} photo${S.ph==1?"":"s"} added (timestamped)</span></div><div class="code">4 8 2 9 1 7</div><p><small>Lender types the code to start the loan.</small></p><input placeholder="Lender enters code"><button class="btn" onclick="S.st=3;t('Loan started (demo)');render()">Confirm handover</button>`;
if(n==3)c=`<p>Due in 14 days. Reminders arrive 3 days before and on the day.</p><div class="row"><button class="btn s" onclick="t('Extension requested (demo)')">Request extension</button><button class="btn" onclick="S.st=4;render()">Start return</button></div>`;
if(n==4)c=`<p>Lender adds return photos, then both confirm with the code.</p><div class="row"><button class="btn sm s" onclick="S.ph++;render()">Add return photo</button></div><button class="btn" onclick="S.st=5;t('Homecoming complete. Your book is back!');render()">Confirm return</button>`;
if(n==5)c=`<h3>All done</h3><p>Rate each other:</p><div class="row">${[1,2,3,4,5].map(x=>`<button class="btn sm s" onclick="t('Rated ${x} stars (demo)')">${x}★</button>`).join("")}</div><p>Rewards are pending for 14 days (demo).</p><button class="btn" onclick="go('rewards')">See rewards</button>`;
return`<h1>Your loan</h1>${steps(A,n)}<div class="card">${c}</div><div class="row"><button class="btn sm s" onclick="t('Problem report form would open (demo)')">Problem?</button><button class="btn sm s" onclick="S.st=1;S.ph=0;render()">Restart demo</button></div>`},
wanted(){return`<h1>Wanted board</h1><p>Ask anonymously. Handles are tied to verified accounts, so rudeness gets banned.</p><div class="card"><label>What are you looking for?</label><input id="wi" placeholder="Book or subject, semester"><button class="btn" onclick="const v=$('#wi').value.trim();if(v){S.W.unshift({h:'NewBookworm_'+(10+S.W.length),t:v,n:0});render()}else t('Type what you need first')">Post anonymously</button><small>Be kind. No personal details. No deals outside the app.</small></div><div class="grid" style="margin-top:20px">${S.W.map(wcard).join("")}</div>`},
dash(){return`${hid()}<h1>Hi there 👋</h1><div class="row"><span class="st ${S.v=="verified"?"g":"l"}">Verification: ${S.v=="none"?"not started":S.v}</span><button class="btn sm s" onclick="go('verify')">Open verification</button></div><div class="grid"><div class="card"><h3>Requests on my books</h3>3 waiting<br><button class="btn sm" onclick="go('lend')">Open</button></div><div class="card"><h3>Current loan</h3>Engineering Physics, due soon<br><button class="btn sm" onclick="go('loan')">Open</button></div><div class="card"><h3>Rewards</h3>Welcome 500 · Earned 0<br><button class="btn sm" onclick="go('rewards')">Open</button></div><div class="card"><h3>My books</h3>${[0,2].map(i=>`${B[i][0]} <span class="st g">Available</span><br>`).join("")}<button class="btn sm s" onclick="lb(1)">List another</button></div></div>`},
rewards(){return`<h1>Rewards</h1><div class="grid"><div class="card"><h3>Welcome credits</h3><div class="f" style="font-size:32px">500</div><small>Only reduce platform fees. Not withdrawable.</small></div><div class="card"><h3>Earned credits</h3><div class="f" style="font-size:32px">1,200</div><small>From completed, paid loans. Count toward payout.</small></div></div><div class="card" style="margin:20px 0"><b>Payout progress: 1,200 / 5,000</b><div class="bar"><i style="width:24%"></i></div><br><button class="btn" disabled>Withdraw</button> <small>Demo only: no real payouts yet.</small></div><table><tr><th>Date</th><th>Event</th><th>Credits</th><th>Status</th></tr><tr><td>Demo</td><td>Welcome bonus</td><td>+500</td><td>Available</td></tr><tr><td>Demo</td><td>Loan completed</td><td>+300</td><td>Pending (14 days)</td></tr><tr><td>Demo</td><td>Loan completed</td><td>+900</td><td>Available</td></tr></table>`},
list(){const n=S.lst,a=["Book","Details","Photos","Fee and rules","Publish"];const N=`<div class="row">${n>1?`<button class="btn s" onclick="lb(${n-1})">Back</button>`:""}${n<5?`<button class="btn" onclick="lb(${n+1})">Next</button>`:`<button class="btn" onclick="t('Your book just entered the group chat.');go('dash')">Publish listing</button>`}</div>`;
const F=[`<label>Title</label><input placeholder="e.g. Engineering Physics"><label>Author</label><input><label>ISBN (optional)</label><input>`,`<label>Edition</label><input><label>Subject</label><select><option>Physics</option><option>Chemistry</option><option>Computer Science</option></select><label>Course and semester</label><input><label>Condition</label><select><option>Like new</option><option>Good</option><option>Fair</option></select>`,`<label>Add at least 2 photos: cover and condition</label><input type="file" accept="image/*" multiple onchange="pv(this)"><div id="pvi"></div>`,`<label>Borrowing fee for 30 days (₹)</label><input type="number" value="40"><label><input type="checkbox" checked>14 days</label><label><input type="checkbox" checked>30 days</label><br><br><label><input type="checkbox" checked>Library entrance</label><label><input type="checkbox">Metro concourse</label><p><small>Books worth over ₹1,500 are not accepted in this version.</small></p>`,`<div class="card note"><h3>Preview</h3>Your listing appears like the book cards in Explore.<br><small>Demo only.</small></div>`];
return`<h1>List a book</h1>${steps(a,n)}<div class="card">${F[n-1]}</div>${N}`},
signup(){return`<h1>Create your account</h1><div class="card" style="max-width:480px"><label>Full name</label><input><label>College email</label><input type="email"><label>Password</label><input type="password"><label>College</label><select><option>Demo College A</option><option>Demo College B</option></select><label>Area</label><select><option>North Kolkata</option><option>South Kolkata</option><option>Salt Lake</option><option>Howrah</option></select><button class="btn" onclick="go('verify')">Create account</button></div>`},
verify(){const v=S.v;let c;
if(v=="none"||v=="rejected")c=`${v=="rejected"?`<div class="card note" style="margin-bottom:14px"><b>Not verified.</b> The name on the ID was hard to read. Upload a clearer photo, or appeal.<br><button class="btn sm s" onclick="t('Appeal sent (demo)')">Appeal</button></div>`:""}<label>Institution</label><select><option>Demo College A</option><option>Demo College B</option></select><label>Student ID photo</label><input type="file" accept="image/*" onchange="pv(this)"><div id="pvi"></div><div class="card note" style="margin:12px 0"><b>Before you upload</b><br>Keep visible: your name, photo and institution name.<br>Hide: roll or registration number, date of birth, address, phone number, QR codes and barcodes.</div><label><input type="checkbox" id="ok">I have hidden those details</label><br><br><button class="btn" onclick="if($('#ok').checked){S.v='pending';render()}else t('Tick the box to confirm first')">Submit for review</button>`;
if(v=="pending")c=`<span class="st l">Pending review</span><p>An admin would check your ID. In this demo, nothing is checked.</p><div class="row"><small>Demo states:</small><button class="btn sm s" onclick="S.v='verified';render()">Verified</button><button class="btn sm s" onclick="S.v='rejected';render()">Rejected</button></div>`;
if(v=="verified")c=`<span class="st g">Student verified · Demo College A</span><p>Only this badge and your college show on your public profile. Your ID is never shown.</p><button class="btn" onclick="go('explore')">Start exploring</button>`;
return`<h1>Student verification</h1><p>Your ID is stored securely, used only to verify you, and deleted afterwards.</p><div class="card" style="max-width:520px">${c}</div>`},
notifs(){return`<h1>Notifications</h1>${["Someone’s eyeing your book 👀","BROOO. It’s yours! 🎉 Pick a time to meet.","Return due in 3 days: Data Structures in C, to Rohan at the library entrance.","Homecoming complete. Your book is back!","This book found its next study buddy. Keep hunting, bro!","Verification update: pending review (demo)."].map(x=>`<div class="card" style="margin:12px 0">${x}</div>`).join("")}`},
how(){return`<h1>How it works</h1><div class="grid"><div class="card"><h3>Find</h3>Search by book, course or college.</div><div class="card"><h3>Ask</h3>Send a request. The owner chooses.</div><div class="card"><h3>Meet</h3>Public spot, photos, handover code.</div><div class="card"><h3>Return</h3>Both confirm. Both rate. Rewards follow.</div></div><div class="band"><h2>Staying safe</h2>Meet in public and in daylight. Don’t share personal contact details. Report problems from any screen.</div>`}};
render();
</script></body></html>
